name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format und vet (Windows und Linux)
        run: make pruefen
      - name: Tests (Linux)
        run: make test
      - name: Bauen (alle Plattformen)
        run: make alle VERSION=ci
  windows:
    # Die Windows-Teile (SSPI, Dienst, WTS) laufen nur dort: Tests, ein
    # Inventar ohne Netz und PSScriptAnalyzer fuer das eingebettete Skript.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go run ./cmd/rosenweg-agent -konfig nichtda.json inventar
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $f = Invoke-ScriptAnalyzer -Path internal/plattform/langsam_windows.ps1 -Severity Warning,Error
          $f | Format-Table -AutoSize
          if ($f) { exit 1 }
