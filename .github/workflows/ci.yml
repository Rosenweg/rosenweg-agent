name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  # Runner-Wahl (Rosenweg/rosenweg-basis, runner-wahl.yml): privat immer eigene,
  # oeffentlich eigene wenn frei oder zuschaltbar, Forks nie. macOS bleibt bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  pruefen:
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    needs: wahl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format und vet (Windows und Linux)
        run: make pruefen
      - name: Tests (Linux)
        run: make test
      - name: Bauen (alle Plattformen)
        run: make alle VERSION=ci
  windows:
    # Die Windows-Teile (SSPI, Dienst, WTS) laufen nur dort: Tests, ein
    # Inventar ohne Netz und PSScriptAnalyzer fuer das eingebettete Skript.
    runs-on: ${{ fromJSON(needs.wahl.outputs.windows) }}
    needs: wahl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -count=1 ./...
      - run: go run ./cmd/rosenweg-agent -konfig nichtda.json inventar
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $f = Invoke-ScriptAnalyzer -Path internal/plattform/langsam_windows.ps1 -Severity Warning,Error
          $f | Format-Table -AutoSize
          if ($f) { exit 1 }
